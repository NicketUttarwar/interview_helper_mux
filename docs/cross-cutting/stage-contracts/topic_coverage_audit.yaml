stage_id: topic_coverage_audit
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: master/coverage_audit.json
  schema: coverage_audit_artifact.schema.json
  staging: true
inputs:
  hard: []
  soft: []
sufficiency:
- path: topics
  rule: min_rows
  min_count: 1
propagation:
  invalidates_stages:
  - narrative_arc_plan
  - connector_fuse_pass_pre_ranking
  - full_master_ranking
  - nugget_corpus_mine
  - nugget_layup_compose
  - transitions
consumers:
- topic_coverage_audit
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- coverage_score
nullable_fields:
- gaps
- notes
