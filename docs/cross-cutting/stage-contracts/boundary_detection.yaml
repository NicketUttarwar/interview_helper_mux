stage_id: boundary_detection
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: segments/boundaries.json
  schema: boundaries_artifact.schema.json
  staging: true
inputs:
  hard:
  - path: understanding/content_brief.json
    producer: content_context
  - path: transcript/full.json
    producer: transcribe
  - path: understanding/speakers.json
    producer: speaker_roles
  soft:
  - path: understanding/talking_points.json
    producer: talking_points_compose
  - path: understanding/ideal_cuts_materialized.json
    producer: ideal_cuts_materialize
  - path: understanding/ideal_cuts.json
    producer: ideal_cuts_propose
  - path: understanding/source_acoustic_profile.json
    producer: source_acoustic_profile
sufficiency:
- path: boundaries
  rule: min_rows
  min_count: 1
  blocking: progression
propagation:
  invalidates_stages:
  - segment_classification
  - content_brief_reanchor
  - sonic_context_build
  - sound_design_palettes
  - missing_framing
consumers:
- segment_classification
- content_brief_reanchor
- sonic_context_build
- sound_design_palettes
- missing_framing
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- boundaries
nullable_fields:
- notes
- warnings
