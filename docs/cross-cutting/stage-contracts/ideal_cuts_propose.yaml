stage_id: ideal_cuts_propose
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/ideal_cuts.json
  schema: ideal_cuts_artifact.schema.json
  staging: true
inputs:
  hard:
  - path: transcript/full.json
    producer: transcribe
  - path: understanding/talking_points.json
    producer: talking_points_compose
  soft:
  - path: understanding/speakers.json
    producer: speaker_roles
  - path: understanding/content_brief.json
    producer: content_context
  - path: transcript/review_queue.json
    producer: transcript_review_build
  - path: analysis/run_golden_facts.json
    producer: audio_probe_build
  - path: transcript/protected_zones.json
    producer: audio_probe_build
sufficiency:
- path: cuts
  rule: min_rows
  min_count: 1
  blocking: progression
propagation:
  invalidates_stages: []
consumers:
- ideal_cuts_materialize
- boundary_detection
- nugget_corpus_mine
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
