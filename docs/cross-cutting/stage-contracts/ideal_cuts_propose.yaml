stage_id: ideal_cuts_propose
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/ideal_cuts.json
  schema: ideal_cuts_artifact.schema.json
  staging: true
inputs:
  hard: []
  soft: []
sufficiency:
- path: cuts
  rule: min_rows
  min_count: 1
  blocking: progression
propagation:
  invalidates_stages: []
consumers: []
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
