stage_id: sound_design_palettes
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/sound_design_plan.json
  schema: sound_design_palettes_artifact.schema.json
  staging: true
inputs:
  hard:
  - path: segments/boundaries.json
    producer: boundary_topic_resplit
  soft: []
sufficiency:
- path: palettes
  rule: min_rows
  min_count: 1
propagation:
  invalidates_stages:
  - missing_framing
  - optimal_questions
consumers:
- sound_design_palettes
- sound_design_plan
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- palettes
nullable_fields:
- notes
