stage_id: sound_design_palettes
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/sound_design_plan.json
  schema: sound_design_palettes_artifact.schema.json
  staging: true
inputs:
  hard:
  - path: segments/boundaries.json
    producer: boundary_topic_resplit
  soft:
  - path: understanding/sound_design_plan.json
  - path: understanding/sonic_context.json
    producer: sonic_context_build
  - path: understanding/content_brief.json
    producer: content_context
  - path: understanding/source_acoustic_profile.json
    producer: source_acoustic_profile
  - path: understanding/value_features.json
  - path: understanding/flow_adaptation.json
    producer: source_topology_build
  - path: understanding/source_topology.json
    producer: source_topology_build
  - path: segments/manifest.json
    producer: segment_classification
sufficiency:
- path: palettes
  rule: min_rows
  min_count: 1
propagation:
  invalidates_stages:
  - missing_framing
  - optimal_questions
consumers:
- soundscape_policy_build
- episode_structure_compose
- sound_design_plan
- edl_narrative_audit
- music_palette_compose
- sfx_prompt_craft
- mix
- junction_snip_qa
- master_finalize
- delivery_brief_build
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- palettes
nullable_fields:
- notes
