stage_id: optimal_questions
tier: meta  # non-stage: retired stage, contract kept for history
# Retired: superseded by gap_framing_compose. The outputs below record what this
# stage wrote historically (delivery_guardrails still resolves it as a stale
# gap_report producer); it is not a current owner in artifact_ownership.py.
retired: true
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/gap_report.json
  schema: gap_report.schema.json
  staging: true
inputs:
  hard:
  - path: understanding/gap_evaluations.json
    producer: missing_framing
  soft: []
sufficiency:
- path: gaps
  rule: min_rows
  min_count: 1
propagation:
  invalidates_stages: []
consumers:
- optimal_questions
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- gaps
nullable_fields:
- gaps[].notes
