stage_id: ideal_cuts_materialize
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/ideal_cuts_materialized.json
  schema: null
  staging: false
- path: understanding/ideal_cuts_selection_seed.json
  staging: true
- path: segments/boundaries.json
  staging: true
inputs:
  hard: []
  soft:
  - path: understanding/ideal_cuts.json
    producer: ideal_cuts_propose
  - path: transcript/full.json
    producer: transcribe
  - path: ingest/normalized.wav
    producer: ingest
  - path: segments/boundaries.json
sufficiency: []
propagation:
  invalidates_stages: []
consumers:
- boundary_detection
- segment_classification
- mastering_shape_agenda
- full_master_ranking
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
