stage_id: mastering_plan_synthesize
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: mastering/mastering_plan.json
  schema: null
  staging: false
- path: glob:mastering/evidence_packets/*.json
inputs:
  hard: []
  soft:
  - path: mastering/shape/candidates.json
    producer: mastering_shape_candidates
  - path: mastering/shape/agenda.json
    producer: mastering_shape_agenda
  - path: mastering/research_dossier.json
    producer: mastering_research_rollup
  - path: understanding/content_brief.json
    producer: content_context
  - path: understanding/source_topology.json
    producer: source_topology_build
  - path: understanding/gap_evaluations.json
    producer: missing_framing
  - path: understanding/gap_report.json
    producer: gap_framing_compose
  - path: understanding/episode_structure.json
    producer: episode_structure_compose
  - path: master/selection.json
    producer: full_master_ranking
  - path: master/narrative_plan.json
    producer: narrative_arc_plan
  - path: segments/manifest.json
    producer: segment_classification
sufficiency: []
propagation:
  invalidates_stages: []
consumers:
- missing_framing
- mastering_plan_confirm
- gap_framing_compose
- delivery_brief_build
- soundscape_policy_build
- episode_structure_compose
- narrative_arc_plan
- chapter_close_hitch
- full_master_ranking
- air_script_compose
- nugget_corpus_mine
- information_package_plan
- nugget_layup_compose
- refinement_agenda
- gap_framing_recompose
- selection_framing_apply
- air_script_seams
- air_contract_sanitize
- transitions
- sound_design_plan
- vo_synthesize
- edl_narrative_audit
- edl
- listen_delight_audit
- music_palette_compose
- mix
- junction_snip_qa
- master_finalize
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
