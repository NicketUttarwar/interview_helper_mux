stage_id: sfx_brief
tier: meta  # non-stage: brief packet built inside sfx_prompt_craft
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: REMOVED_flow2/sfx_brief.json
  schema: sfx_montage_artifact.schema.json
  staging: true
inputs:
  hard: []
  soft: []
sufficiency:
- path: montage
  rule: non_empty_string
  min_length: 8
propagation:
  invalidates_stages: []
consumers:
- sfx_brief
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
