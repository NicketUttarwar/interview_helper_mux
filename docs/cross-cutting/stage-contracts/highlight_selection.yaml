stage_id: REMOVED_highlight_selection
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: REMOVED_flow2/selection.json
  schema: highlights_artifact.schema.json
  staging: true
inputs:
  hard:
  - path: understanding/gap_report.json
    producer: optimal_questions
  soft: []
sufficiency:
- path: highlights
  rule: min_rows
  min_count: 1
propagation:
  invalidates_stages:
  - REMOVED_sdp_flow2
consumers:
- REMOVED_highlight_selection
remediation:
  strategies:
  - micro_gap_fill
  - patch_volley
  - volley_retry
  - full_stage_rerun
critical_fields:
- highlights
nullable_fields:
- notes
