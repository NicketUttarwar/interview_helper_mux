stage_id: ingest
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: ingest/normalized.wav
  schema: null
  staging: false
- path: ingest/checksums.json
  staging: true
- path: ingest/loudness.json
  staging: true
- path: ingest/waveform_peaks.json
  staging: true
inputs:
  hard: []
  soft:
  - path: preclean/isolated.wav
    producer: audio_preclean
sufficiency: []
propagation:
  invalidates_stages: []
consumers:
- transcribe
- audio_probe_build
- transcript_review_build
- source_acoustic_profile
- source_topology_build
- mix
- master_finalize
remediation:
  strategies:
  - full_stage_rerun
