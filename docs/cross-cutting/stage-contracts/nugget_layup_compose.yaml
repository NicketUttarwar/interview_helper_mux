stage_id: nugget_layup_compose
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/nugget_layup_plan.json
  schema: nugget_layup_plan_artifact.schema.json
  staging: true
- path: understanding/gap_report.json
  schema: gap_report.schema.json
  staging: true
inputs:
  hard:
  - path: master/selection.json
    producer: full_master_ranking
  - path: understanding/nugget_corpus.json
    producer: nugget_corpus_mine
  soft:
  - path: segments/manifest.json
    producer: segment_classification
  - path: understanding/talking_points.json
    producer: talking_points_compose
sufficiency:
- path: layups
  rule: min_rows
  min_count: 0
propagation:
  invalidates_stages:
  - gap_framing_recompose
  - selection_framing_apply
  - transitions
  - edl
consumers:
- gap_framing_recompose
- edl
- g1_vo_pickup
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- ordered_segment_ids
- layups
nullable_fields:
- warnings
- open_talking_point_ids
