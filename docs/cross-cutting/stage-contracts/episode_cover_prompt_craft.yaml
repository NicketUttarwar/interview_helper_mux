stage_id: episode_cover_prompt_craft
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: publish/cover_prompt.json
  schema: null
  staging: true
inputs:
  hard: []
  soft:
  - path: publish/episode_meta.json
    producer: episode_meta_build
  - path: understanding/content_brief.json
    producer: content_context
  - path: master/selection.json
    producer: full_master_ranking
sufficiency:
- path: prompt
  rule: non_empty_string
  min_length: 1
propagation:
  invalidates_stages: []
consumers:
- episode_cover_generate
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
