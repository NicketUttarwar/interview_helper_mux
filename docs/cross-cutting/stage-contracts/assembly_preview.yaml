stage_id: assembly_preview
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: master/assembly_preview.wav
  schema: null
  staging: false
inputs:
  hard:
  - path: master/edl.json
    producer: edl
  soft:
  - path: master/selection.json
    producer: full_master_ranking
  - path: ingest/normalized.wav
    producer: ingest
sufficiency: []
propagation:
  invalidates_stages: []
consumers:
- junction_snip_qa
- mix
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
