stage_id: low_conf_island_scan
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: analysis/low_conf_islands.json
  schema: null
  staging: false
- path: analysis/low_conf_density_ranking.json
  staging: true
- path: analysis/low_conf_must_keep.json
  staging: true
inputs:
  hard: []
  soft:
  - path: segments/manifest.json
    producer: segment_classification
  - path: transcript/full.json
    producer: transcribe
  - path: analysis/vernacular_must_keep.json
    producer: vernacular_segment_sanitize
sufficiency: []
propagation:
  invalidates_stages:
  - connector_fuse_pass
  - full_master_ranking
consumers:
- connector_fuse_pass
- full_master_ranking
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
