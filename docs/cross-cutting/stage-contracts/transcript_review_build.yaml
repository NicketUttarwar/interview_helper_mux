stage_id: transcript_review_build
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: transcript/review_queue.json
  schema: null
  staging: false
- path: transcript/corrections.json
  staging: true
- path: glob:transcript/review_clips/*.wav
  staging: true
inputs:
  hard:
  - path: transcript/full.json
    producer: transcribe
  soft:
  - path: transcript/speakers.json
    producer: transcribe
  - path: ingest/normalized.wav
    producer: ingest
sufficiency: []
propagation:
  invalidates_stages: []
consumers:
- transcript_review
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
