stage_id: source_topology_build
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/source_topology.json
  schema: null
  staging: false
- path: understanding/flow_adaptation.json
  staging: true
- path: glob:understanding/speaker_samples/*.wav
  staging: true
inputs:
  hard:
  - path: understanding/speakers.json
    producer: speaker_roles
  - path: transcript/full.json
    producer: transcribe
  soft:
  - path: ingest/normalized.wav
    producer: ingest
sufficiency: []
propagation:
  invalidates_stages:
  - content_context
  - boundary_detection
  - segment_classification
  - missing_framing
  - narrative_arc_plan
  - full_master_ranking
  - sound_design_plan
consumers:
- content_context
- boundary_detection
- segment_classification
- boundary_topic_resplit
- missing_framing
- narrative_arc_plan
- full_master_ranking
- sound_design_plan
remediation:
  strategies:
  - full_stage_rerun
