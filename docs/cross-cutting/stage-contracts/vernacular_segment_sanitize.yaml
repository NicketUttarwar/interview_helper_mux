stage_id: vernacular_segment_sanitize
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: vernacular/resplit_report.json
  schema: null
  staging: false
- path: segments/manifest.json
  staging: true
- path: analysis/vernacular_must_keep.json
  staging: true
- path: transcript/protected_zones.json
inputs:
  hard:
  - path: segments/boundaries.json
    producer: boundary_topic_resplit
  soft:
  - path: transcript/protected_zones.json
    producer: audio_probe_build
  - path: segments/manifest.json
    producer: segment_classification
  - path: analysis/run_golden_facts.json
    producer: audio_probe_build
  - path: transcript/speaker_flows.json
    producer: transcribe
  - path: vernacular/audio_tags_by_flow.json
sufficiency: []
propagation:
  invalidates_stages:
  - low_conf_island_scan
  - connector_fuse_pass
consumers:
- low_conf_island_scan
- connector_fuse_pass
- full_master_ranking
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
