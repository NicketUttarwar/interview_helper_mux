stage_id: sound_design_vo_finalize
tier: deterministic
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: mastering/sound_design_vo_finalize.json
  schema: sound_design_vo_finalize.schema.json
  staging: false
- path: understanding/sound_design_plan.json
  staging: true
- path: vo_pickup/
  staging: true
inputs:
  hard: []
  soft: []
sufficiency:
- path: skipped
  rule: required_fields
  fields:
  - skipped
  - refused
propagation:
  invalidates_stages:
  - vo_line_adjudicate
  - vo_synthesize
  - edl_narrative_audit
  - edl
consumers: []
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
