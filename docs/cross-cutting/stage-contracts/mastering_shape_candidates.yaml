stage_id: mastering_shape_candidates
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: mastering/shape/candidates.json
  schema: null
  staging: false
- path: mastering/shape/diversity_report.json
- path: glob:mastering/evidence_packets/*.json
inputs:
  hard: []
  soft:
  - path: mastering/shape/agenda.json
    producer: mastering_shape_agenda
  - path: mastering/research_dossier.json
    producer: mastering_research_rollup
  - path: understanding/content_brief.json
    producer: content_context
  - path: understanding/source_topology.json
    producer: source_topology_build
  - path: understanding/gap_evaluations.json
    producer: missing_framing
  - path: understanding/gap_report.json
    producer: gap_framing_compose
  - path: master/selection.json
    producer: full_master_ranking
  - path: segments/manifest.json
    producer: segment_classification
  - path: mastering/mastering_plan.json
    producer: mastering_plan_synthesize
sufficiency: []
propagation:
  invalidates_stages: []
consumers:
- mastering_plan_synthesize
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
