stage_id: air_script_compose
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: mastering/mastering_plan.json
  schema: mastering_plan.schema.json
  staging: true
inputs:
  hard:
  - path: master/selection.json
    producer: full_master_ranking
  soft:
  - path: mastering/mastering_plan.json
    producer: mastering_plan_synthesize
sufficiency:
- path: air_script.beats
  rule: min_rows
  min_count: 0
propagation:
  invalidates_stages: []
consumers:
- air_script_seams
- edl
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
