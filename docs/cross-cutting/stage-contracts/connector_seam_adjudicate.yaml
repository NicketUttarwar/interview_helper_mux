stage_id: connector_seam_adjudicate
tier: meta  # non-stage: adjudicator invoked inside connector_fuse_pass
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: analysis/connector_seam_verdicts.json
  schema: connector_seam_adjudicate.schema.json
  staging: true
inputs:
  hard:
  - path: analysis/connector_seam_packets.json
    producer: connector_fuse_pass
  soft:
  - path: segments/manifest.json
    producer: segment_classification
sufficiency:
- path: verdicts
  rule: min_rows
  min_count: 0
propagation:
  invalidates_stages: []
consumers:
- connector_fuse_pass
- connector_fuse_pass_pre_ranking
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- verdicts
nullable_fields:
- verdicts[].fuse_direction
- verdicts[].rationale
