stage_id: sound_design_plan_flow1
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/sound_design_plan.json
  schema: sound_design_plan_flow1_artifact.schema.json
  staging: true
inputs:
  hard:
  - path: flow_1_master/selection.json
    producer: full_master_ranking
  soft: []
sufficiency:
- path: assets
  rule: min_rows
  min_count: 1
propagation:
  invalidates_stages:
  - sfx_prompt_craft
  - edl_flow1
consumers:
- sound_design_palettes
- sound_design_plan_flow1
- sound_design_plan_flow2
remediation:
  strategies:
  - micro_gap_fill
  - patch_volley
  - volley_retry
  - full_stage_rerun
