stage_id: master_transcript_build
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: master/transcript.json
  schema: master_transcript.schema.json
  staging: false
- path: master/transcript.vtt
- path: master/transcript.txt
- path: glob:transcripts/transition/*.json
  staging: true
- path: glob:transcripts/vo/*.json
  staging: true
- path: glob:transcripts/speech/*.json
  staging: true
- path: transcripts/index.json
  staging: true
inputs:
  hard:
  - path: master/master.wav
    producer: master_finalize
  - path: master/edl.json
    producer: edl
  soft:
  - path: transcripts/index.json
sufficiency:
- path: cues
  rule: min_rows
  min_count: 1
propagation:
  invalidates_stages:
  - podcast_publish
consumers:
- podcast_publish
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
