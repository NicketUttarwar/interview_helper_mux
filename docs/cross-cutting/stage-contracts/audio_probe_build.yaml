stage_id: audio_probe_build
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: analysis/run_golden_facts.json
  schema: null
  staging: false
- path: transcript/protected_zones.json
  staging: true
- path: transcript/speaker_flows.json
  staging: true
- path: vernacular/probe_report.json
  staging: true
- path: vernacular/audio_tags_by_flow.json
  staging: true
inputs:
  hard:
  - path: transcript/full.json
    producer: transcribe
  soft:
  - path: ingest/normalized.wav
    producer: ingest
sufficiency: []
propagation:
  invalidates_stages: []
consumers:
- vernacular_segment_sanitize
- low_conf_island_scan
- boundary_detection
- segment_classification
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
