stage_id: nugget_corpus_mine
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/nugget_corpus.json
  schema: nugget_corpus_artifact.schema.json
  staging: true
inputs:
  hard:
  - path: master/selection.json
    producer: full_master_ranking
  soft:
  - path: segments/manifest.json
    producer: segment_classification
  - path: understanding/talking_points.json
    producer: talking_points_compose
  - path: understanding/ideal_cuts.json
    producer: ideal_cuts_propose
sufficiency:
- path: nuggets
  rule: min_rows
  min_count: 0
propagation:
  invalidates_stages:
  - nugget_layup_compose
  - gap_framing_recompose
  - transitions
  - vo_synthesize
  - edl
consumers:
- nugget_layup_compose
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- nuggets
nullable_fields:
- warnings
