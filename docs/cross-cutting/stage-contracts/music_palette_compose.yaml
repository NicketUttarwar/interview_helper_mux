stage_id: music_palette_compose
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: sound_design/music_palette_compose.json
  schema: music_palette_compose_artifact.schema.json
  staging: true
- path: understanding/sound_design_plan.json
  staging: true
inputs:
  hard:
  - path: understanding/sound_design_plan.json
    producer: sound_design_plan
  soft:
  - path: understanding/music_brief.json
    producer: sound_design_plan
  - path: master/edl.json
    producer: edl
  - path: master/selection.json
    producer: full_master_ranking
  - path: understanding/episode_structure.json
    producer: episode_structure_compose
sufficiency:
- path: cues
  rule: min_rows
  min_count: 1
propagation:
  invalidates_stages: []
consumers:
- sfx_prompt_craft
- mmaudio_sfx
- mix
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
