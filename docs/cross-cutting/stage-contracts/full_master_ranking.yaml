stage_id: full_master_ranking
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: master/selection.json
  schema: master_selection_artifact.schema.json
  staging: true
inputs:
  hard:
  - path: master/narrative_plan.json
    producer: narrative_arc_plan
  soft: []
sufficiency:
- path: ranked_segments
  rule: min_rows
  min_count: 1
propagation:
  invalidates_stages:
  - transitions
  - sound_design_plan
  - edl
consumers:
- full_master_ranking
remediation:
  strategies:
  - micro_gap_fill
  - patch_volley
  - volley_retry
  - full_stage_rerun
critical_fields:
- ordered_segment_ids
nullable_fields:
- excluded_segment_ids
- notes
