stage_id: full_master_ranking
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: master/selection.json
  schema: master_selection_artifact.schema.json
  staging: true
- path: master/rank_candidates.json
- path: master/order_reconcile.json
- path: master/story_health.json
- path: mastering/media_ip_cta.json
- path: understanding/reorder_bridges.json
- path: understanding/speaker_delivery_plan.json
- path: analysis/stt_lexicon_islands.json
inputs:
  hard:
  - path: master/narrative_plan.json
    producer: narrative_arc_plan
  - path: segments/manifest.json
    producer: segment_classification
  - path: understanding/gap_report.json
    producer: gap_framing_compose
  soft:
  - path: master/selection.json
  - path: understanding/reorder_bridges.json
  - path: understanding/speaker_delivery_plan.json
  - path: analysis/connector_fuse_rounds.json
    producer: connector_fuse_pass_pre_ranking
  - path: master/coverage_audit.json
    producer: topic_coverage_audit
  - path: analysis/run_golden_facts.json
    producer: audio_probe_build
  - path: master/transitions.json
    producer: transitions
  - path: mastering/mastering_plan.json
    producer: mastering_plan_synthesize
  - path: mastering/media_ip_cta.json
    producer: full_master_ranking
  - path: segments/boundaries.json
    producer: boundary_detection
  - path: segments/nle_edits.json
  - path: transcript/full.json
    producer: transcribe
  - path: transcript/review_queue.json
    producer: transcript_review_build
  - path: understanding/content_brief.json
    producer: content_context
  - path: understanding/delivery_brief.json
    producer: delivery_brief_build
  - path: understanding/episode_structure.json
    producer: episode_structure_compose
  - path: understanding/flow_adaptation.json
    producer: source_topology_build
  - path: understanding/gap_framing_plan.json
    producer: gap_framing_compose
  - path: understanding/ideal_cuts.json
    producer: ideal_cuts_propose
  - path: understanding/interview_spine.json
    producer: interview_spine_build
  - path: understanding/nugget_corpus.json
    producer: nugget_corpus_mine
  - path: understanding/nugget_layup_plan.json
    producer: nugget_layup_compose
  - path: understanding/source_acoustic_profile.json
    producer: source_acoustic_profile
  - path: understanding/source_topology.json
    producer: source_topology_build
  - path: understanding/speakers.json
    producer: speaker_roles
  - path: understanding/talking_points.json
    producer: talking_points_compose
  - path: analysis/high_value_speech_boosts.json
    producer: low_conf_island_scan
  - path: analysis/high_value_speech_islands.json
    producer: low_conf_island_scan
sufficiency:
- path: ranked_segments
  rule: min_rows
  min_count: 1
propagation:
  invalidates_stages:
  - nugget_corpus_mine
  - nugget_layup_compose
  - transitions
  - sound_design_plan
  - vo_synthesize
  - edl
consumers:
- missing_framing
- mastering_plan_confirm
- gap_framing_compose
- delivery_brief_build
- soundscape_policy_build
- episode_structure_compose
- chapter_close_hitch
- selection_order_sanitize
- air_script_compose
- nugget_corpus_mine
- information_package_plan
- nugget_layup_compose
- gap_report_sanitize
- gap_framing_recompose
- selection_framing_apply
- air_script_seams
- air_contract_sanitize
- transitions
- sound_design_plan
- sound_design_vo_finalize
- edl_narrative_audit
- edl
- listen_delight_audit
- music_palette_compose
- sfx_prompt_craft
- mix
- junction_snip_qa
- master_finalize
- podcast_publish
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- ordered_segment_ids
nullable_fields:
- excluded_segment_ids
- notes
