stage_id: vo_synthesize
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: mastering/vo_synthesize.json
  schema: null
  staging: false
- path: master/transitions/
  staging: true
- path: vo_pickup/synthesized/
  staging: true
- path: vo_pickup/
  staging: true
inputs:
  hard:
  - path: understanding/gap_report.json
    producer: gap_framing_compose
  - path: master/transitions.json
    producer: transitions
  soft:
  - path: mastering/mastering_plan.json
    producer: mastering_plan_synthesize
  - path: understanding/omit_ledger.json
    producer: air_contract_sanitize
  - path: mastering/vo_speech_qa.json
sufficiency: []
propagation:
  invalidates_stages:
  - edl_narrative_audit
  - edl
consumers:
- sound_design_vo_finalize
- edl_narrative_audit
- edl
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
