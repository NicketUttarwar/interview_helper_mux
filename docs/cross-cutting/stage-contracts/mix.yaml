stage_id: mix
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: master/assembly.wav
  schema: null
  staging: false
- path: master/music_cue_coverage.json
  staging: true
inputs:
  hard:
  - path: ingest/normalized.wav
    producer: ingest
  - path: master/selection.json
    producer: full_master_ranking
  - path: master/edl.json
    producer: edl
  - path: understanding/sound_design_plan.json
    producer: sound_design_plan
  soft:
  - path: master/transitions.json
    producer: transitions
  - path: master/junction_snip_qa.json
    producer: junction_snip_qa
  - path: master/seam_autopsy.json
  - path: understanding/omit_ledger.json
    producer: air_script_compose
  - path: understanding/gap_report.json
    producer: gap_framing_compose
  - path: sound_design/mmaudio_qa.json
    producer: mmaudio_sfx
sufficiency: []
propagation:
  invalidates_stages: []
consumers:
- junction_snip_qa
- master_finalize
- listen_delight_audit
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
