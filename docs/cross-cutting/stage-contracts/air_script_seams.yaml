stage_id: air_script_seams
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: mastering/mastering_plan.json
  schema: mastering_plan.schema.json
  staging: true
inputs:
  hard:
  - path: mastering/mastering_plan.json
    producer: air_script_compose
  soft:
  - path: understanding/nugget_layup_plan.json
    producer: nugget_layup_compose
  - path: understanding/gap_report.json
    producer: nugget_layup_compose
sufficiency:
- path: air_script.beats
  rule: min_rows
  min_count: 0
propagation:
  invalidates_stages: []
consumers:
- transitions
- music_palette_compose
- edl
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
