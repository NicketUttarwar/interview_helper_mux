stage_id: audio_preclean
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: preclean/isolated.wav
  schema: null
  staging: false
- path: preclean/provider.json
  staging: true
- path: preclean/lineage.json
  staging: true
- path: preclean/skip.json
inputs:
  hard: []
  soft:
  - path: ingest/normalized.wav
    producer: ingest
sufficiency: []
propagation:
  invalidates_stages: []
consumers:
- ingest
- vo_ingest
- vo_synthesize
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
