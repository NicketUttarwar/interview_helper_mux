stage_id: framing_posture_decide
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/framing_posture_decision.json
  schema: framing_posture_decision.schema.json
  staging: true
inputs:
  hard: []
  soft:
  - path: understanding/speakers.json
    producer: speaker_roles
  - path: understanding/source_topology.json
    producer: source_topology_build
  - path: understanding/flow_adaptation.json
    producer: source_topology_build
sufficiency:
- path: recommended_framing
  rule: non_empty_string
  blocking: progression
- path: posture_hint
  rule: non_empty_string
  blocking: progression
propagation:
  invalidates_stages: []
consumers:
- missing_framing
- gap_framing_compose
- transitions
- vo_synthesize
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
