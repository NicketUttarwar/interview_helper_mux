stage_id: vo_line_adjudicate
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/vo_line_adjudication.json
  schema: vo_line_adjudication_artifact.schema.json
  staging: true
- path: understanding/gap_report.json
  staging: true
inputs:
  hard:
  - path: understanding/nugget_layup_plan.json
    producer: nugget_layup_compose
  - path: understanding/gap_report.json
    producer: gap_framing_compose
  soft:
  - path: understanding/nugget_corpus.json
    producer: nugget_corpus_mine
  - path: understanding/omit_ledger.json
    producer: air_script_compose
  - path: understanding/native_comprehension_masks.json
  - path: understanding/content_brief.json
    producer: content_context
sufficiency:
- path: lines
  rule: min_rows
  min_count: 0
propagation:
  invalidates_stages:
  - vo_synthesize
  - edl_narrative_audit
  - edl
consumers:
- vo_synthesize
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
