stage_id: sound_design_plan
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/sound_design_plan.json
  schema: sound_design_plan_artifact.schema.json
  staging: true
inputs:
  hard:
  - path: master/transitions.json
    producer: transitions
  soft: []
sufficiency:
- path: assets
  rule: min_rows
  min_count: 1
propagation:
  invalidates_stages:
  - sfx_prompt_craft
  - vo_line_adjudicate
  - vo_synthesize
  - edl
consumers:
- sound_design_palettes
- sound_design_plan
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- assets
- flow_plans
nullable_fields:
- notes
