stage_id: segment_classification
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: segments/manifest.json
  schema: manifest_artifact.schema.json
  staging: true
inputs:
  hard:
  - path: segments/boundaries.json
    producer: boundary_detection
  soft:
  - path: transcript/full.json
    producer: transcribe
  - path: understanding/speakers.json
    producer: speaker_roles
  - path: understanding/talking_points.json
    producer: talking_points_compose
  - path: understanding/content_brief.json
    producer: content_context
  - path: master/edl.json
  - path: transcript/review_queue.json
    producer: transcript_review_build
  - path: analysis/run_golden_facts.json
    producer: audio_probe_build
  - path: transcript/protected_zones.json
    producer: audio_probe_build
sufficiency:
- path: segments
  rule: min_rows
  min_count: 1
  blocking: progression
propagation:
  invalidates_stages:
  - content_brief_reanchor
  - sonic_context_build
  - sound_design_palettes
  - missing_framing
  - optimal_questions
consumers:
- content_brief_reanchor
- vernacular_segment_sanitize
- low_conf_island_scan
- connector_fuse_pass
- sonic_context_build
- sound_design_palettes
- missing_framing
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- segments
- segments[].segment_id
- segments[].type
nullable_fields:
- segments[].notes
- segments[].topic_tags
