stage_id: source_acoustic_profile
tier: deterministic
lifecycle:
  phases:
  - prestage
  - pre_call
  - execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: understanding/source_acoustic_profile.json
  schema: null
  staging: false
inputs:
  hard:
  - path: ingest/normalized.wav
    producer: ingest
  - path: transcript/full.json
    producer: transcribe
  soft:
  - path: preclean/isolated.wav
    producer: audio_preclean
sufficiency: []
propagation:
  invalidates_stages: []
consumers:
- interview_spine_build
- boundary_detection
- sonic_context_build
- sound_design_palettes
- mastering_plan_synthesize
remediation:
  strategies:
  - full_stage_rerun
