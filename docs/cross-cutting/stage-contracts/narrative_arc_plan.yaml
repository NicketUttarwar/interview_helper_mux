stage_id: narrative_arc_plan
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: master/narrative_plan.json
  schema: narrative_plan_artifact.schema.json
  staging: true
inputs:
  hard:
  - path: master/coverage_audit.json
    producer: topic_coverage_audit
  - path: understanding/content_brief.json
    producer: content_context
  soft:
  - path: master/narrative_plan.json
  - path: mastering/mastering_plan.json
    producer: mastering_plan_synthesize
  - path: understanding/episode_structure.json
    producer: episode_structure_compose
  - path: understanding/source_topology.json
    producer: source_topology_build
  - path: understanding/flow_adaptation.json
  - path: understanding/value_features.json
  - path: segments/manifest.json
    producer: segment_classification
  - path: segments/boundaries.json
    producer: boundary_detection
sufficiency:
- path: chapters
  rule: min_rows
  min_count: 1
propagation:
  invalidates_stages:
  - chapter_close_hitch
  - connector_fuse_pass_pre_ranking
  - full_master_ranking
  - transitions
consumers:
- mastering_plan_synthesize
- mastering_plan_confirm
- missing_framing
- gap_framing_compose
- soundscape_policy_build
- chapter_close_hitch
- full_master_ranking
- air_script_compose
- gap_framing_recompose
- transitions
- sound_design_plan
- edl_narrative_audit
- edl
- music_palette_compose
- sfx_prompt_craft
- mix
- junction_snip_qa
- master_finalize
- podcast_publish
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- chapters
nullable_fields:
- chapters[].act_title
- chapters[].is_moat_chapter
- chapters[].tension_level
- notes
- ordering_constraints
- pacing_notes
