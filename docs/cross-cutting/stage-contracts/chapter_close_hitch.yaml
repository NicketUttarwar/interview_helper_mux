stage_id: chapter_close_hitch
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: mastering/chapter_close_hitch.json
  schema: chapter_close_hitch.schema.json
  staging: false
- path: mastering/chapter_close_hitch/intent_plan.json
  schema: narrative_plan_artifact.schema.json
  staging: true
- path: mastering/chapter_close_hitch/remap.json
  staging: true
inputs:
  hard:
  - path: master/narrative_plan.json
    producer: narrative_arc_plan
  soft:
  - path: segments/manifest.json
    producer: segment_classification
  - path: transcript/full.json
    producer: transcribe
sufficiency:
- path: status
  rule: non_empty_string
  min_length: 1
propagation:
  invalidates_stages:
  - connector_fuse_pass_pre_ranking
  - full_master_ranking
consumers:
- connector_fuse_pass_pre_ranking
- full_master_ranking
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- status
nullable_fields:
- chapter_authority
- reason
- restaged
- rewritten
- unmatched_must_keep_ids
