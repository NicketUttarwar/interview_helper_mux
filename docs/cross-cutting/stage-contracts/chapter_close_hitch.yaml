stage_id: chapter_close_hitch
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: mastering/chapter_close_hitch.json
  schema: chapter_close_hitch.schema.json
  staging: false
- path: mastering/chapter_close_hitch/intent_plan.json
  schema: narrative_plan_artifact.schema.json
  staging: true
- path: mastering/chapter_close_hitch/remap.json
  staging: true
- path: understanding/episode_structure_compact.txt
  staging: true
- path: segments/boundaries.json
  staging: true
- path: mastering/chapter_close_hitch/hitch_keepers.json
- path: mastering/chapter_close_hitch/pre_keepers.json
- path: mastering/chapter_close_hitch/omit_ledger.json
- path: mastering/chapter_close_hitch/vo_snapshot.json
- path: master/narrative_plan.qc.json
inputs:
  hard:
  - path: master/narrative_plan.json
    producer: narrative_arc_plan
  soft:
  - path: segments/manifest.json
    producer: segment_classification
  - path: transcript/full.json
    producer: transcribe
  - path: mastering/chapter_close_hitch.json
  - path: master/selection.json
    producer: full_master_ranking
  - path: mastering/mastering_plan.json
    producer: mastering_plan_synthesize
  - path: understanding/content_brief.json
    producer: content_context
  - path: understanding/episode_structure.json
    producer: episode_structure_compose
  - path: understanding/flow_adaptation.json
    producer: source_topology_build
  - path: understanding/gap_report.json
    producer: gap_framing_compose
  - path: understanding/ideal_cuts_materialized.json
    producer: ideal_cuts_materialize
  - path: understanding/nugget_corpus.json
    producer: nugget_corpus_mine
  - path: understanding/nugget_layup_plan.json
    producer: nugget_layup_compose
  - path: understanding/omit_ledger.json
    producer: air_script_compose
  - path: understanding/source_topology.json
    producer: source_topology_build
  - path: understanding/speaker_delivery_plan.json
    producer: full_master_ranking
  - path: understanding/speakers.json
    producer: speaker_roles
  - path: understanding/talking_points.json
    producer: talking_points_compose
  - path: segments/boundaries.json
    producer: boundary_detection
  - path: ingest/normalized.wav
    producer: ingest
sufficiency:
- path: status
  rule: non_empty_string
  min_length: 1
propagation:
  invalidates_stages:
  - connector_fuse_pass_pre_ranking
  - full_master_ranking
consumers:
- connector_fuse_pass_pre_ranking
- full_master_ranking
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
critical_fields:
- status
nullable_fields:
- chapter_authority
- reason
- restaged
- rewritten
- unmatched_must_keep_ids
