stage_id: mmaudio_sfx
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: sound_design/mmaudio_qa.json
  schema: mmaudio_qa.schema.json
  staging: false
- path: sound_design/assets/
  staging: true
- path: master/sfx/
  staging: true
inputs:
  hard:
  - path: understanding/sound_design_plan.json
    producer: sound_design_plan
  - path: sound_design/sfx_prompts.json
    producer: sfx_prompt_craft
  soft: []
sufficiency:
- path: assets
  rule: min_rows
  min_count: 0
propagation:
  invalidates_stages: []
consumers:
- mix
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
