stage_id: REMOVED_podcast_show_description
tier: llm_full
lifecycle:
  phases:
  - prestage
  - pre_call
  - llm_execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: show_notes/show_description.json
  schema: show_description_artifact.schema.json
  staging: true
inputs:
  hard: []
  soft: []
sufficiency:
- path: description
  rule: non_empty_string
  min_length: 50
propagation:
  invalidates_stages: []
consumers:
- REMOVED_podcast_show_description
remediation:
  strategies:
  - micro_gap_fill
  - patch_volley
  - volley_retry
  - full_stage_rerun
critical_fields:
- description
nullable_fields:
- keywords
- subtitle
