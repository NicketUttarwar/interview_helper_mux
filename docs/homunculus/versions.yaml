brains:
  - id: "0.0.0"
    label: Original
    kind: original_pipeline
    summary: >
      Progress through the steps iteratively as they were created and originally
      intended. Linear analysis and delivery, existing gates, per-stage LLMs.
  - id: "0.1.0"
    label: Homunculus (legacy id)
    kind: homunculus
    control_plane: llm
    prompt_tree: docs/prompts/homunculus/
    summary: >
      Legacy brain id only — resume ancient run_meta; not offered on Start.
  - id: "0.2.0"
    label: Homunculus
    kind: homunculus
    control_plane: deterministic
    prompt_tree: docs/prompts/homunculus/
    summary: >
      Default brain: ledger, admit, dispatch budgets, packing, MusicGen ladder,
      ears. Stage order is the fixed seed walk.

# kind stays `homunculus` for 0.2.0 on purpose: is_homunculus_run gates the
# ledger/admit/dispatch rails at ~22 call sites. Control flow is selected by
# `control_plane`, not `kind`. 0.1.0 remains registered for resume only;
# brains_public() hides it from the Start tab.
#
# New runs default to the highest registered id unless config pins
# mastering.homunculus.default_version (currently 0.2.0 via "latest").
