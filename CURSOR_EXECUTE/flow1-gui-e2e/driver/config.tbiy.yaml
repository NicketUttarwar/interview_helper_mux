# TBIY narrative profile — extends default Flow 1 E2E config
input_wav: ASSETS/notebooklm_original_interview_2024.wav
production_style: tbiy_narrative
topology_fixture: one_on_one_asymmetric
base_url: http://127.0.0.1:8765
poll_interval_s: 2
heartbeat_interval_s: 30
stall_timeout_s: 120
api_request_timeout_s: 30
api_poll_max_consecutive_failures: 3
stage_timeouts_s:
  transcribe: 1800
  mmaudio_sfx_flow1: 3600
  default: 900
tbiy_gates:
  topology_confirm: true
  story_lock_tbiy: true
  g1_5_preview_pickup: true
screenshot_on:
  - gate
  - blocker
  - error
execution_screenshots_dir: ASSETS/flow1-gui-e2e-screenshots
execution_screenshot_min_interval_s: 120
headed: false
verbose: false
