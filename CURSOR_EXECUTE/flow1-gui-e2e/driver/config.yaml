input_wav: ASSETS/notebooklm_original_interview_2024.wav
base_url: http://127.0.0.1:8765
poll_interval_s: 2
heartbeat_interval_s: 30
stall_timeout_s: 120
api_request_timeout_s: 30
api_poll_max_consecutive_failures: 3
stage_timeouts_s:
  transcribe: 1800
  mmaudio_sfx: 3600
  default: 900
screenshot_on:
  - gate
  - blocker
  - error
execution_screenshots_dir: ASSETS/flow1-gui-e2e-screenshots
execution_screenshot_min_interval_s: 120
headed: false
verbose: false
# First-try: gate_handlers prefer batch Save (gui.write_approval.batch_save) when deferred.
# Clean STT: expect G0 auto-complete; G1 only when high/critical VO missing.
first_try_mode: true
