[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-execute"
version = "0.1.0"
description = "Markdown-driven Cursor SDK agent queue runner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cursor-sdk>=0.1.0",
  "typer>=0.12,<1",
  "rich>=13.9,<14",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
cursor-execute = "cursor_execute.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
