[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "e2e-runner"
version = "0.1.0"
description = "Autonomous journey-driven E2E runner for interview_helper_mux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.49,<2",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "rich>=13.9,<14",
  "cursor-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
e2e-runner = "e2e_runner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
