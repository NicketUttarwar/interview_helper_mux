[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-mux"
version = "0.1.0"
description = "Interview audio pipeline — analysis, selection, assembly, Web GUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.3",
  "python-multipart==0.0.30",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]==0.47.0",
  "openai==2.38.0",
  "typer==0.25.1",
  "rich==13.9.4",
  "jsonschema==4.26.0",
  "PyYAML>=6.0,<7",
  "filelock==3.29.0",
  "pydantic==2.13.4",
  "numpy==2.4.6",
  "pyloudnorm==0.2.0",
  "pydub==0.25.1",
  "soundfile==0.13.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pip-audit>=2.7,<3", "ruff>=0.9,<1"]

[project.scripts]
interview-mux = "interview_mux.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interview_mux = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["F821"]
